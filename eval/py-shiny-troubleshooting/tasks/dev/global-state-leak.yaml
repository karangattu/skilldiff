id: global-state-leak
category: intended
split: dev
repo: ../../fixtures/global-state-leak
allowed_paths:
  - app.py
grader_ignore: python-tooling
validation:
  good:
    - ../../solutions/global-state-leak/good-1
    - ../../solutions/global-state-leak/good-2
  broken:
    - ../../solutions/global-state-leak/broken
prompt: |
  In `app.py`, notes added by one browser session appear in every other user's
  session. Isolate the state per session in `app.py` so sessions do not leak
  notes to each other.
grader:
  type: command
  command: python3 "$SKILLDIFF_TASK_DIR/../../graders/grade_global_state_leak.py"
