[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldiff"
version = "0.1.0"
description = "Measure what an Agent Skill changes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karan" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
skilldiff = "skilldiff.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["skilldiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
