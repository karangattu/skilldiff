[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldiff"
version = "0.27.0"
description = "Measure what an Agent Skill changes: A/B test agents with and without a skill."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Karan Gathani" }]
keywords = ["agent-skills", "claude-code", "codex", "evaluation", "benchmark", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/karangattu/skilldiff"
Issues = "https://github.com/karangattu/skilldiff/issues"

[project.scripts]
skilldiff = "skilldiff.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["skilldiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests that run subprocesses or CLI commands",
    "container: marks tests requiring docker or podman container runtimes",
    "network: marks tests requiring external network access",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
files = ["skilldiff", "tests"]
exclude = [
    "build/",
    "dist/",
    ".venv/",
    ".pytest_cache/",
    ".ruff_cache/",
]
