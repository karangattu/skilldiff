[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilldiff"
version = "0.4.0"
description = "Measure what an Agent Skill changes: A/B test agents with and without a skill."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karan Gathani" }]
keywords = ["agent-skills", "claude-code", "codex", "evaluation", "benchmark", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/karangattu/skilldiff"
Issues = "https://github.com/karangattu/skilldiff/issues"

[project.scripts]
skilldiff = "skilldiff.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["skilldiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
