name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests with pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -v

      - name: Verify installed wheel and console entry point
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv "$RUNNER_TEMP/skilldiff-wheel"
          "$RUNNER_TEMP/skilldiff-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/skilldiff-wheel/bin/skilldiff" --version
          "$RUNNER_TEMP/skilldiff-wheel/bin/skilldiff" init --dir wheel-demo
          "$RUNNER_TEMP/skilldiff-wheel/bin/skilldiff" lint wheel-demo/skills/changelog-style

  current-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, antigravity, opencode]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Install the current official CLI
        shell: bash
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          case "$HARNESS" in
            claude) npm install -g @anthropic-ai/claude-code@latest ;;
            codex) npm install -g @openai/codex@latest ;;
            antigravity)
              curl -fsSL https://antigravity.google/cli/install.sh -o "$RUNNER_TEMP/agy-install.sh"
              bash "$RUNNER_TEMP/agy-install.sh" --dir "$RUNNER_TEMP/agy"
              echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
              ;;
            opencode)
              mkdir -p "$RUNNER_TEMP/opencode"
              curl -fsSL https://opencode.ai/update/api/latest/cli/opencode/opencode-linux-x64-baseline.tar.gz -o "$RUNNER_TEMP/opencode.tar.gz"
              tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode"
              echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Check native commands, formats, and Codex discovery without model calls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SKILLDIFF_LIVE_CLI: ${{ matrix.harness }}
        run: pytest tests/test_live_cli_contract.py -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build sandbox Docker image
        run: docker build -t ghcr.io/karangattu/skilldiff-sandbox:latest docker
      - name: Verify sandbox image tools and agent CLIs
        run: |
          docker run --rm ghcr.io/karangattu/skilldiff-sandbox:latest /bin/sh -lc "
            claude --version &&
            codex --version &&
            opencode --version &&
            agy --version &&
            antigravity --version &&
            uv --version &&
            pytest --version &&
            ruff --version &&
            rg --version &&
            fd --version &&
            jq --version &&
            sqlite3 --version &&
            curl -fsSI https://example.com >/dev/null
          "
      - name: Verify real container paths, grading, and cleanup
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SKILLDIFF_CONTAINER_RUNTIME: docker
          SKILLDIFF_CONTAINER_IMAGE: ghcr.io/karangattu/skilldiff-sandbox:latest
        run: pytest tests/test_audit_container.py -v
